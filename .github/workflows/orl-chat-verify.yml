name: ORL-Chat Deterministic Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orl-chat-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ORL-Chat v2.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Display runtime versions
        run: |
          python --version
          node --version

      - name: Verify frozen selected-file checkpoint
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          from pathlib import Path
          import hashlib
          import re
          import sys

          pins = {
              "demo/ORL_Chat_Reference_Kernel_v2_0_0.py":
                  "6f7ea4a1ce256da001883d48f702a3bb4eb02c6c7eb7696496f4cbe2dca9af50",
              "demo/ORL_Chat_Browser_Resolver_v2_0_0.js":
                  "5c87f65599f50a708ff040d0b4870dcced0dffc75a0181a47005b135f89e98ad",
              "demo/ORL_Chat_Conversation_State_Capsule_v2_0_0.py":
                  "7f16bab8f581c0f1e3974757b2b1c122ae55057772372c9e7a82b08725dd1658",
              "demo/ORL_Chat_Conversation_State_Capsule_v2_0_0.js":
                  "7bdf16458dfd5a9726e8ff54504719665c0188fbdfd3275beee8673dc67fc596",
              "verifier/ORL_Chat_Independent_Verifier_v2_0_0.py":
                  "90c7583638cb45483cecc2adb727e4e5efdd816f8310a3a96ed7fec8b0d1326e",
              "verifier/ORL_Chat_Browser_Parity_Verifier_v2_0_0.js":
                  "563a33e7f33d928a96281296320e8d36357d2f96983edc74ee71bc08db401757",
              "verifier/ORL_Chat_C3_Assurance_Verifier_v2_0_0.py":
                  "2f5d88c6018f5c0116e2ede5dbfd8731c316985db1c19ec6b138dfc9fc795120",
              "verifier/ORL_Chat_Capsule_Parity_Verifier_v2_0_0.js":
                  "162452b373ab95e427446c996f1e69f048f5b3933f3b98e21451dc203117d982",
              "verifier/ORL_Chat_Cross_Language_Cross_Check_v2_0_0.py":
                  "380be3b4721d2aac1e64851d5133ca688a51e6343696641c8cd53833dd70f320",
              "verifier/ORL_Chat_Seeded_Property_Verifier_v2_0_0.py":
                  "1abd7b66c82bcd1f4b7be23bbbe61beecbe4010101241459116b19181905b4d8",
              "VERIFY_ALL.py":
                  "10c19c21cde56249b5725281ec7ca2031a250b2e82c90d3c20a12d72add9d05d",
              "corpus/ORL_Chat_Frozen_Corpus_Manifest_v2_0_0.json":
                  "c5d4034684eaff6f5418f2a953accf3b85ac9946f4e5f7f5718a0cb18007e4d9",
              "parity/ORL_Chat_Cross_Language_Parity_Vectors_v2_0_0.json":
                  "2d6fe855afabb33d3cc4b0cb43724a7c7819a564aa924f69a0e2f3d2b2ca35ee",
              "capsules/ORL_Chat_Conversation_State_Capsule_Vectors_v2_0_0.json":
                  "38dca39258ff55d4310871a45a59667b41fd65e89f0f8e0a9176c375aa66ebf6",
          }

          manifest_path = Path("hashes/SHA256SUMS.txt")

          if not manifest_path.is_file():
              print("FAIL: hashes/SHA256SUMS.txt is missing.")
              sys.exit(1)

          manifest = {}

          for raw_line in manifest_path.read_text(
              encoding="utf-8-sig"
          ).splitlines():
              line = raw_line.strip()

              if not line:
                  continue

              parts = line.split(maxsplit=1)

              if len(parts) != 2:
                  print(
                      "FAIL: Invalid SHA256SUMS.txt line: "
                      + repr(raw_line)
                  )
                  sys.exit(1)

              digest, relative_path = parts
              digest = digest.lower()
              relative_path = relative_path.strip()

              if not re.fullmatch(r"[0-9a-f]{64}", digest):
                  print(
                      "FAIL: Invalid SHA-256 digest for "
                      + relative_path
                  )
                  sys.exit(1)

              if relative_path in manifest:
                  print(
                      "FAIL: Duplicate checksum entry: "
                      + relative_path
                  )
                  sys.exit(1)

              manifest[relative_path] = digest

          if manifest != pins:
              print(
                  "FAIL: SHA256SUMS.txt does not match "
                  "the frozen ORL-Chat v2.0.0 checkpoint."
              )
              sys.exit(1)

          for relative_path, expected in pins.items():
              path = Path(relative_path)

              if not path.is_file():
                  print("FAIL: Missing file: " + relative_path)
                  sys.exit(1)

              actual = hashlib.sha256(path.read_bytes()).hexdigest()

              if actual != expected:
                  print("FAIL: SHA-256 mismatch: " + relative_path)
                  print("EXPECTED: " + expected)
                  print("ACTUAL:   " + actual)
                  sys.exit(1)

              print("PASS: " + relative_path)

          print("")
          print("ORL-Chat v2.0.0 selected-file checkpoint: 14/14 PASS")
          PY

      - name: Run complete verification
        shell: bash
        run: |
          set -euo pipefail

          RESULT="$RUNNER_TEMP/orl-chat-complete-verification.txt"

          python -B VERIFY_ALL.py | tee "$RESULT"

      - name: Validate verification summary
        shell: bash
        run: |
          set -euo pipefail

          RESULT="$RUNNER_TEMP/orl-chat-complete-verification.txt"

          python - "$RESULT" <<'PY'
          from pathlib import Path
          import re
          import sys

          text = Path(sys.argv[1]).read_text(encoding="utf-8")

          required = [
              r"^TOTAL: 2955/2955 PASS$",
              r"^TOTAL: 173/173 PASS$",
              r"^entries: 13/13 PASS$",
              r"^TOTAL: 442/442 PASS$",
              r"^TOTAL: 17/17 PARITY$",
              r"^TOTAL: 8/8 PARSER PARITY$",
              r"^CASES: 32/32 PASS$",
              r"^ASSERTIONS: 256/256 PASS$",
              r"^TOTAL: 14/14 PASS$",
              r"^TOTAL: 154/154 PASS$",
              r"^TOTAL: 310/310 PASS$",
              r"^text_profile: ORL-CHAT-UNICODE-SCALAR-EXACT-2-D01$",
              r"^PRNG_PROFILE: ORL-CHAT-SPLITMIX64-2-D01$",
              r"^parity_set_id: parity_set_369011571b5fb4daae502946ec9b527f143e14fed80fcf4517eab1f656ace774$",
              r"^vector_set_id: capsule_vector_set_a8621728d37589b0bafdc208f1cb15ed6218d304870d40cb2ef4d2d74388a917$",
              r"^SHA-256 selected-file verification: PASS$",
              r"^ORL-Chat v2\.0\.0 complete verification: PASS$",
          ]

          missing = [
              pattern
              for pattern in required
              if not re.search(pattern, text, flags=re.MULTILINE)
          ]

          if missing:
              print("FAIL: Verification summary mismatch.")

              for pattern in missing:
                  print("MISSING: " + pattern)

              sys.exit(1)

          print("ORL-Chat v2.0.0 verification summary: PASS")
          PY

      - name: Verify deterministic regeneration
        shell: bash
        run: |
          set -euo pipefail

          git diff --exit-code -- .

          UNTRACKED="$(git ls-files --others --exclude-standard)"

          if [ -n "$UNTRACKED" ]; then
            echo "FAIL: Verification produced untracked files."
            printf '%s\n' "$UNTRACKED"
            exit 1
          fi

          echo "Deterministic regeneration: PASS"

      - name: Verification summary
        run: |
          echo "ORL-CHAT v2.0.0 VERIFICATION PASS"
          echo "Frozen selected-file checkpoint: 14/14 PASS"
          echo "Python reference tests: 2955/2955 PASS"
          echo "Independent verifier tests: 173/173 PASS"
          echo "Frozen corpus: 13/13 PASS"
          echo "Browser and cross-language parity: 442/442 PASS"
          echo "Live bundle parity: 17/17 PARITY"
          echo "Raw parser parity: 8/8 PARSER PARITY"
          echo "Generated cases: 32/32 PASS"
          echo "Generated assertions: 256/256 PASS"
          echo "Capsule audit: 14/14 PASS"
          echo "Adversarial assurance: 154/154 PASS"
          echo "Capsule parity: 310/310 PASS"
          echo "Selected-file SHA-256 verification: PASS"
          echo "Deterministic regeneration: PASS"
